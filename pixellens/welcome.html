<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>PixelLens</title><body><h1>PixelLens</h1><p>نسختك المحلية جاهزة. افتح أي موقع عادي واضغط على أيقونة الإضافة.</p><p>Alt+R لفتح الأدوات، Alt+I لفحص العناصر، Alt+M للقياسات.</p><p>صفحات إعدادات المتصفح ومتجر الإضافات لا تسمح بتشغيل الأدوات.</p></body></html>
