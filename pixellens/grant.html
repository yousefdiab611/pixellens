<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Allow downloads – PixelLens</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #111113;
      color: #e4e4e7;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; visibility: hidden; }
    /* Shown only when the question is needed; otherwise the window saves the files and closes */
    body.ask main { visibility: visible; }
    img { display: block; width: 40px; height: 40px; border-radius: 10px; }
    h1 { margin: 4px 0 0; font-size: 19px; font-weight: 650; line-height: 1.25; letter-spacing: -0.01em; color: #fafafa; }
    p { margin: 0; color: #a1a1aa; }
    .actions { display: flex; gap: 8px; margin-top: 6px; }
    button {
      height: 42px;
      padding: 0 16px;
      border-radius: 10px;
      border: 1px solid transparent;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
    }
    #allow { flex: 1; background: #93b4ff; color: #09090b; }
    #allow:hover { background: #adc6ff; }
    #later { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.12); color: #fafafa; }
    #later:hover { background: rgba(255, 255, 255, 0.14); }
    button:disabled { opacity: 0.55; cursor: default; }
    button:focus-visible { outline: 2px solid #93b4ff; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon48.png" alt="">
    <h1>Let PixelLens save files</h1>
    <p>Images, SVGs and videos you download from a page go straight to your Downloads folder. We ask once, and your browser will ask you to confirm.</p>
    <div class="actions">
      <button id="allow" type="button">Allow downloads</button>
      <button id="later" type="button">Not now</button>
    </div>
  </main>
  <script src="grant.js"></script>
</body>
</html>
